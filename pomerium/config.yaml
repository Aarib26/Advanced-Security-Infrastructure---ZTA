address: ":8444"
log_level: debug
xff_num_trusted_hops: 1

cookie_same_site: lax
cookie_domain: ztauser.tail65943a.ts.net

idp_provider: oidc
idp_provider_url: https://ztauser.tail65943a.ts.net/realms/zta
idp_client_id: pomerium
idp_scopes:
  - openid
  - profile
  - email
  - offline_access

jwt_claims_headers:
  email: email
  groups: groups
  sub: sub

policy:
  - from: https://ztauser.tail65943a.ts.net
    to: http://localhost:30080
    prefix: /zta-app
    pass_identity_headers: true
    prefix_rewrite: /
    allow_any_authenticated_user: true
    preserve_host_header: true
  - from: https://ztauser.tail65943a.ts.net
    prefix: /zta-admin
    to: http://localhost:8082
    pass_identity_headers: true
    allowed_idp_claims:
      groups:
        - admins
    preserve_host_header: true
